<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>守城 · 沙盒 v0.4</title>
<style>
  :root{ --bg:#0b1018; --panel:#131c29; --ink:#e8eef7; --muted:#7d8ca3; --gold:#e2c14a; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#070a10;color:var(--ink);
    font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;}
  #wrap{position:relative;width:960px;height:640px;margin:24px auto;}
  canvas{display:block;border-radius:14px;background:var(--bg);
    box-shadow:0 24px 80px rgba(0,0,0,.65),0 0 0 1px #1d2836;}
  #overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
    background:rgba(7,10,16,.88);border-radius:14px;}
  #overlay.show{display:flex;}
  .card{width:760px;padding:32px 36px;background:var(--panel);border:1px solid #223047;
    border-radius:16px;box-shadow:0 30px 80px rgba(0,0,0,.55);}
  .card h1{font-size:27px;margin:0 0 8px;letter-spacing:.02em;}
  .card h2{font-size:21px;margin:0 0 8px;}
  .card p{color:var(--muted);line-height:1.75;font-size:14px;margin:6px 0;}
  .card p b{color:var(--ink);}
  .dim{color:var(--muted)}
  .mono{font-family:ui-monospace,Menlo,monospace;font-size:14px;line-height:1.9;}
  .cards{display:flex;gap:12px;margin-top:18px;}
  .cards.wrap{flex-wrap:wrap;}
  .cards.wrap .ecard{flex:0 0 calc(50% - 6px);}
  .ucard,.ecard{flex:1;padding:15px 15px 17px;border:1px solid #223047;border-radius:12px;
    background:#0f1826;cursor:pointer;transition:.15s;}
  .ucard:hover,.ecard:hover{border-color:var(--gold);transform:translateY(-3px);}
  .ucard b,.ecard b{display:block;font-size:15.5px;margin-bottom:6px;color:var(--gold);}
  .ucard span,.ecard span{font-size:12.5px;color:var(--muted);line-height:1.6;display:block;}
  .ecard .orb{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;
    justify-content:center;font-weight:700;font-size:14px;margin-bottom:8px;}
  .btn{display:inline-block;margin-top:20px;padding:11px 26px;border-radius:10px;
    background:var(--gold);color:#1a1405;font-weight:700;cursor:pointer;border:none;font-size:15px;}
  .btn:hover{filter:brightness(1.08)}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv" width="960" height="640"></canvas>
  <div id="overlay"></div>
</div>
<script>
(function(){
'use strict';

var cv = document.getElementById('cv');
var ctx = cv.getContext('2d');
var overlay = document.getElementById('overlay');

// ---------------------------------------------------------------- 常量
var W = 960, H = 640;
var SPAWN_Y = 92;
var WALL_TOP = 530;
var TURRET = { x: 480, y: 604 };
var BASE_RANGE = 560;
var SHOT_SPEED = 920;
var MAX_WAVE = 15;
var STACK_MAX = 5;

var BASE = ['fire', 'water', 'earth', 'wind'];

// ---------------------------------------------------------------- 元素
var ELEMS = {
  fire:    { name:'火',   ch:'火', c:'#ff7a45', tier:0 },
  water:   { name:'水',   ch:'水', c:'#4aa3ff', tier:0 },
  wind:    { name:'风',   ch:'风', c:'#5ad2b0', tier:0 },
  earth:   { name:'土',   ch:'土', c:'#d4a72c', tier:0 },
  thunder: { name:'电',   ch:'电', c:'#ffe14a', tier:1 },
  blast:   { name:'爆',   ch:'爆', c:'#ff6b3d', tier:1 },
  metal:   { name:'金属', ch:'金', c:'#b9c3cf', tier:1 },
  ice:     { name:'冰',   ch:'冰', c:'#8fdcff', tier:1 },
  poison:  { name:'毒',   ch:'毒', c:'#7ed957', tier:1 },
  sand:    { name:'沙',   ch:'沙', c:'#e0c48a', tier:1 },
  glass:   { name:'玻璃', ch:'璃', c:'#9fe8d8', tier:2 },
  mud:     { name:'泥',   ch:'泥', c:'#9c7f5b', tier:2 },
  molten:  { name:'熔金', ch:'熔', c:'#ffa04d', tier:2 },
  rust:    { name:'锈',   ch:'锈', c:'#c06b3e', tier:2 },
  smoke:   { name:'烟',   ch:'烟', c:'#8d97a3', tier:2 },
  magnet:  { name:'磁',   ch:'磁', c:'#b06bd6', tier:2 },
  vapor:   { name:'汽',   ch:'汽', c:'#cfd8e4', tier:2 },
  frost:   { name:'霜雷', ch:'霖', c:'#a8e0ff', tier:3 },
  magstorm:{ name:'磁暴', ch:'霎', c:'#c78bff', tier:3 },
  acidsteel:{name:'蚀钢', ch:'蚀', c:'#a5d94a', tier:3 },
  ironsand:{ name:'砂铁', ch:'砂', c:'#cbb08a', tier:3 },
  frostblast:{name:'霜爆',ch:'霰', c:'#ffd6c2', tier:3 }
};

var RECIPES = {
  'fire+water':'thunder', 'fire+wind':'blast', 'earth+fire':'metal',
  'water+wind':'ice', 'earth+water':'poison', 'earth+wind':'sand',
  'fire+ice':'water', 'fire+sand':'glass', 'sand+water':'mud',
  'fire+metal':'molten', 'metal+water':'rust', 'fire+poison':'smoke',
  'earth+thunder':'magnet', 'thunder+water':'vapor',
  'ice+thunder':'frost', 'metal+thunder':'magstorm', 'metal+poison':'acidsteel',
  'metal+sand':'ironsand', 'blast+ice':'frostblast'
};
var REDUCE = { 'fire+ice': 1 };

// 四系只有手感差异，没有特性；混合形态沿用"后加元素"的手感
var BASE_PROFILES = {
  water: { dmg: 8,  rate: 0.30 },
  fire:  { dmg: 14, rate: 0.50 },
  wind:  { dmg: 6,  rate: 0.24 },
  earth: { dmg: 24, rate: 0.80 }
};

// 混合形态的特性：每击效果 + 5 层触发
var TRAITS = {
  ice:    { name:'冻结', c:'#8fdcff', perHit:{ type:'slow', amt:.2,  t:.8 }, proc:{ type:'freeze',     val:1.0 } },
  thunder:{ name:'爆发', c:'#ffe14a', perHit:null,                          proc:{ type:'burst',      val:1.5 } },
  poison: { name:'中毒', c:'#7ed957', perHit:{ type:'dot', dps:2, t:3 },    proc:{ type:'poisonNova',  val:8   } },
  blast:  { name:'爆炸', c:'#ff6b3d', perHit:null,                          proc:{ type:'explosion',   val:2.0 } },
  metal:  { name:'破甲', c:'#b9c3cf', perHit:null,                          proc:{ type:'break',      val:.3  } },
  sand:   { name:'击退', c:'#e0c48a', perHit:null,                          proc:{ type:'shove',      val:40  } }
};

// 第三元素 = 融合领域；普攻形态不变
var DOMAINS = {
  frost:     { name:'霜雷领域', c:'#a8e0ff', desc:'链雷 3 个目标 + 短麻痹' },
  frostblast:{ name:'霜爆领域', c:'#ffd6c2', desc:'爆炸 + 给周围叠冰层' },
  magstorm:  { name:'磁暴领域', c:'#c78bff', desc:'把怪拉向中心 + 伤害' },
  acidsteel: { name:'蚀钢领域', c:'#a5d94a', desc:'全场中毒 + 破甲' },
  smoke:     { name:'烟幕领域', c:'#8d97a3', desc:'全场减速 + 持续伤害' }
};
function domainOf(id) {
  return DOMAINS[id] || { name: ELEMS[id].name + '领域', c: ELEMS[id].c, desc: '范围伤害 + 减速' };
}

var TYPES = {
  grunt:   { name:'兵', hp:55,  spd:38, breach:6,  r:14, color:'#d8613c' },
  phantom: { name:'影', hp:70,  spd:44, breach:7,  r:15, color:'#8f7bd6', dr:.5 },
  regen:   { name:'生', hp:135, spd:30, breach:5,  r:18, color:'#3fa574', heal:5 },
  runner:  { name:'疾', hp:52,  spd:100, breach:9, r:12, color:'#e2c14a' },
  boss:    { name:'攻城兽', hp:1100, spd:18, breach:35, r:34, color:'#c0392b', boss:true }
};

var WAVES = [
  { grunt:3 },
  { grunt:4, phantom:1 },
  { grunt:4, phantom:2 },
  { grunt:3, regen:2 },
  { grunt:5, phantom:2, runner:1 },
  { phantom:3, runner:2 },
  { regen:3, grunt:3 },
  { runner:4, grunt:4 },
  { phantom:3, regen:2, grunt:3 },
  { runner:5, phantom:3, regen:2 },
  { grunt:7, phantom:3 },
  { regen:3, runner:4 },
  { phantom:4, grunt:5 },
  { runner:4, regen:3, phantom:2 },
  { boss:1, grunt:4 }
];

var ULT = {
  water:'wave', fire:'nova', wind:'vortex', earth:'quake',
  ice:'wave', thunder:'vortex', poison:'nova', blast:'nova', metal:'quake', sand:'wave'
};

// ---------------------------------------------------------------- 状态
var S = null;
var SEED = 1;

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function newState(el, seed) {
  var start = el || 'water';
  return {
    scene: 'title',
    wave: 1,
    maxWave: MAX_WAVE,
    wall: 100, wallMax: 100,
    element: start,
    form: start,
    formProfile: start,
    domain: null,
    domainTimer: 0,
    mods: {
      dmgMul: 1, rateMul: 1, rangeMul: 1, chargeMax: 20,
      stacksPerHit: 1, procPower: 1, procDur: 1, decayDelay: 3, perHitMul: 1,
      domainPower: 1, domainCd: 6, domainRadius: 1
    },
    monsters: [], shots: [], spawns: [], impacts: [], pops: [],
    waveT: 0, fireTimer: 0.4, charge: 0, mark: null, paused: false,
    stats: { kills: 0, leaks: 0, shots: 0, ults: 0, upgrades: [] },
    rng: mulberry32(seed || 1),
    nextId: 1,
    choiceType: null,
    choices: [],
    toast: null,
    flash: 0
  };
}

function profile() {
  var base = BASE_PROFILES[S.formProfile] || BASE_PROFILES.water;
  return {
    dmg: base.dmg * S.mods.dmgMul,
    rate: base.rate * S.mods.rateMul,
    range: BASE_RANGE * S.mods.rangeMul,
    color: ELEMS[S.form].c,
    trait: TRAITS[S.form] || null
  };
}

function tierName(t) { return ['基础', '一级', '二级', '三级'][t] || '?'; }

// ---------------------------------------------------------------- 流程
function startRun(el, seed) {
  S = newState(el, seed == null ? SEED : seed);
  S.scene = 'play';
  closeOverlay();
  startWave(1);
}

function startWave(n) {
  S.wave = n;
  S.scene = 'play';
  S.waveT = 0;
  S.fireTimer = 0.35;
  S.spawns = makeSpawns(n);
  S.monsters = [];
  S.shots = [];
  S.impacts = [];
  S.pops = [];
  S.mark = null;
  S.paused = false;
  S.choiceType = null;
  S.choices = [];
  S.toast = { text: '第 ' + n + ' 波 · ' + ELEMS[S.form].name + '（' + tierName(ELEMS[S.form].tier) + '）', t: 2.0 };
  overlay.className = '';
  overlay.replaceChildren();
}

function makeSpawns(n) {
  var spec = WAVES[n - 1];
  var order = [];
  for (var k in spec) for (var i = 0; i < spec[k]; i++) order.push(k);
  for (var a = order.length - 1; a > 0; a--) {
    var b = Math.floor(S.rng() * (a + 1));
    var tmp = order[a]; order[a] = order[b]; order[b] = tmp;
  }
  var t = 0.8, out = [];
  for (var j = 0; j < order.length; j++) {
    var type = order[j];
    var gap = type === 'boss' ? 2.4 : (type === 'runner' ? 1.0 : 1.5);
    t += gap * (0.7 + S.rng() * 0.6);
    out.push({ t: t, type: type, x: 70 + S.rng() * (W - 140) });
  }
  out.sort(function (x, y) { return x.t - y.t; });
  return out;
}

function spawn(o) {
  var T = TYPES[o.type];
  var mul = 1 + (S.wave - 1) * 0.12;
  var hp = Math.round(T.hp * mul);
  S.monsters.push({
    id: S.nextId++, type: o.type, x: o.x, y: SPAWN_Y,
    hp: hp, max: hp, hurt: 0, dead: false,
    slowT: 0, slowAmt: 0, amp: 0, ampT: 0, dot: null,
    stacks: 0, stackT: 0, decayT: 0, procCd: 0, frozenT: 0,
    boss: !!T.boss
  });
}

// ---------------------------------------------------------------- 战斗
function pickTarget() {
  var p = profile();
  var best = null;
  if (S.mark != null) {
    for (var i = 0; i < S.monsters.length; i++) {
      var m = S.monsters[i];
      if (m.id === S.mark && !m.dead && inRange(m, p.range)) { best = m; break; }
    }
    if (!best) S.mark = null;
  }
  if (!best) {
    for (var j = 0; j < S.monsters.length; j++) {
      var q = S.monsters[j];
      if (q.dead || !inRange(q, p.range)) continue;
      if (!best || q.y > best.y) best = q;
    }
  }
  return best;
}

function inRange(m, range) {
  var dx = m.x - TURRET.x, dy = m.y - TURRET.y;
  return dx * dx + dy * dy <= range * range;
}

function aimPoint(t) {
  var spd = TYPES[t.type].spd * (t.slowT > 0 ? (1 - t.slowAmt) : 1);
  var py = t.y;
  for (var n = 0; n < 3; n++) {
    var dx = t.x - TURRET.x, dy = py - TURRET.y;
    var d = Math.sqrt(dx * dx + dy * dy) || 1;
    py = t.y + spd * (d / SHOT_SPEED);
  }
  return { x: t.x, y: py };
}

function fire(t) {
  var p = profile();
  var ap = aimPoint(t);
  var dx = ap.x - TURRET.x, dy = ap.y - TURRET.y;
  var d = Math.sqrt(dx * dx + dy * dy) || 1;
  S.shots.push({
    x: TURRET.x, y: TURRET.y - 22,
    px: TURRET.x, py: TURRET.y - 22,
    vx: dx / d * SHOT_SPEED, vy: dy / d * SHOT_SPEED,
    dmg: p.dmg, color: p.color, dead: false
  });
  S.stats.shots++;
  S.charge++;
  if (S.charge >= S.mods.chargeMax) {
    S.charge = 0;
    ultimate(t);
  }
}

function ultimate(t) {
  var p = profile();
  var kind = ULT[S.form] || 'nova';
  var dmg = 30 + p.dmg * 2.2;
  S.stats.ults++;
  S.flash = 0.4;
  var list = S.monsters.slice();
  for (var i = 0; i < list.length; i++) {
    var m = list[i];
    if (m.dead) continue;
    var dx = m.x - t.x, dy = m.y - t.y;
    var dist = Math.sqrt(dx * dx + dy * dy);
    var hit = false;
    if (kind === 'nova' && dist < 160) hit = true;
    else if (kind === 'wave' && Math.abs(m.y - t.y) < 95) hit = true;
    else if (kind === 'vortex' && dist < 185) hit = true;
    else if (kind === 'quake') hit = true;
    if (hit) {
      m.hp -= dmg * (TYPES[m.type].dr || 1) * (1 + (m.amp || 0));
      m.hurt = 0.16;
      if (kind === 'wave' || kind === 'quake') m.y = Math.max(SPAWN_Y, m.y - 24);
      if (kind === 'vortex') m.x += (t.x - m.x) * 0.45;
      if (m.hp <= 0) killMonster(m);
    }
  }
  S.impacts.push({ x: t.x, y: t.y, t: 0.55, max: 0.55, r: kind === 'quake' ? 220 : 155, color: p.color, ult: true });
  S.pops.push({ x: t.x, y: t.y - 30, text: '元素爆发', t: 1.1, color: p.color });
}

function update(dt) {
  if (!S) return;
  if (S.scene !== 'play' || S.paused) return;
  if (dt > 0.06) dt = 0.06;
  S.waveT += dt;
  if (S.flash > 0) S.flash -= dt;
  if (S.toast) { S.toast.t -= dt; if (S.toast.t <= 0) S.toast = null; }

  for (var ii = S.impacts.length - 1; ii >= 0; ii--) {
    S.impacts[ii].t -= dt;
    if (S.impacts[ii].t <= 0) S.impacts.splice(ii, 1);
  }
  for (var pi = S.pops.length - 1; pi >= 0; pi--) {
    S.pops[pi].t -= dt;
    S.pops[pi].y -= 26 * dt;
    if (S.pops[pi].t <= 0) S.pops.splice(pi, 1);
  }

  // 领域
  if (S.domain) {
    S.domainTimer -= dt;
    if (S.domainTimer <= 0) {
      triggerDomain();
      S.domainTimer = S.mods.domainCd;
    }
  }

  while (S.spawns.length && S.spawns[0].t <= S.waveT) spawn(S.spawns.shift());

  for (var i = 0; i < S.monsters.length; i++) {
    var m = S.monsters[i];
    if (m.dead) continue;
    var T = TYPES[m.type];
    if (m.hurt > 0) m.hurt -= dt;
    if (m.slowT > 0) m.slowT -= dt;
    if (m.ampT > 0) { m.ampT -= dt; if (m.ampT <= 0) m.amp = 0; }
    if (m.procCd > 0) m.procCd -= dt;
    if (m.dot) { m.hp -= m.dot.dps * dt; m.dot.t -= dt; if (m.dot.t <= 0) m.dot = null; }
    if (T.heal && m.hp < m.max) m.hp = Math.min(m.max, m.hp + T.heal * dt);

    // 印记衰减
    m.stackT += dt;
    if (m.stackT > S.mods.decayDelay && m.stacks > 0) {
      m.decayT += dt;
      if (m.decayT >= 1) { m.stacks--; m.decayT = 0; }
    } else if (m.stackT <= S.mods.decayDelay) {
      m.decayT = 0;
    }

    if (m.frozenT > 0) {
      m.frozenT -= dt;
    } else {
      var spd = T.spd * (m.slowT > 0 ? (1 - m.slowAmt) : 1);
      m.y += spd * dt;
    }

    if (m.y >= WALL_TOP - 8) {
      S.wall -= T.breach;
      S.stats.leaks++;
      m.dead = true;
      S.impacts.push({ x: m.x, y: WALL_TOP, t: 0.4, max: 0.4, r: 40, color: '#e0603c' });
      if (S.wall <= 0) { S.wall = 0; lose(); return; }
      continue;
    }
    if (m.hp <= 0) killMonster(m);
  }

  S.fireTimer -= dt;
  if (S.fireTimer <= 0) {
    var tg = pickTarget();
    if (tg) { fire(tg); S.fireTimer = profile().rate; }
    else S.fireTimer = 0.06;
  }

  for (var j = S.shots.length - 1; j >= 0; j--) {
    var s = S.shots[j];
    s.px = s.x; s.py = s.y;
    s.x += s.vx * dt; s.y += s.vy * dt;
    if (s.x < -20 || s.x > W + 20 || s.y < -20 || s.y > H + 20) { S.shots.splice(j, 1); continue; }

    var hit = false;
    for (var q = 0; q < S.monsters.length; q++) {
      var mm = S.monsters[q];
      if (mm.dead) continue;
      if (segDist(s.px, s.py, s.x, s.y, mm.x, mm.y) > TYPES[mm.type].r + 7) continue;
      hitMonster(mm, s);
      hit = true;
      break;
    }
    if (hit) S.shots.splice(j, 1);
  }

  S.monsters = S.monsters.filter(function (x) { return !x.dead; });
  if (!S.spawns.length && !S.monsters.length) waveClear();
}

function hitMonster(m, s) {
  if (m.dead) return;
  var T = TYPES[m.type];
  m.hp -= s.dmg * (T.dr || 1) * (1 + (m.amp || 0));
  m.hurt = 0.12;

  var tr = TRAITS[S.form];
  if (tr && tr.perHit) {
    if (tr.perHit.type === 'slow') {
      m.slowAmt = Math.max(m.slowAmt || 0, tr.perHit.amt * S.mods.perHitMul);
      m.slowT = Math.max(m.slowT || 0, tr.perHit.t);
    } else if (tr.perHit.type === 'dot') {
      m.dot = { dps: Math.max(m.dot ? m.dot.dps : 0, tr.perHit.dps * S.mods.perHitMul), t: Math.max(m.dot ? m.dot.t : 0, tr.perHit.t) };
    }
  }
  if (tr) addStacks(m, tr);
  if (m.hp <= 0) killMonster(m);
}

function addStacks(m, tr) {
  if (m.procCd > 0) return;
  m.stacks += S.mods.stacksPerHit;
  m.stackT = 0;
  m.decayT = 0;
  if (m.stacks >= STACK_MAX) {
    m.stacks = 0;
    m.procCd = 2;
    doProc(m, tr);
  }
}

function doProc(m, tr) {
  var p = profile();
  var power = S.mods.procPower;
  var val = tr.proc.val;
  if (tr.proc.type === 'freeze') {
    m.frozenT = Math.max(m.frozenT, val * S.mods.procDur * (m.boss ? 0.5 : 1));
    S.impacts.push({ x: m.x, y: m.y, t: 0.35, max: 0.35, r: 26, color: tr.c, ult: true });
    S.pops.push({ x: m.x, y: m.y - 24, text: '冻结', t: 0.8, color: tr.c });
  } else if (tr.proc.type === 'burst') {
    var dmg = p.dmg * val * power;
    m.hp -= dmg * (TYPES[m.type].dr || 1) * (1 + (m.amp || 0));
    areaDamage(m.x, m.y, 70, dmg * 0.5, tr.c, false);
    S.impacts.push({ x: m.x, y: m.y, t: 0.3, max: 0.3, r: 60, color: tr.c, ult: true });
    S.pops.push({ x: m.x, y: m.y - 24, text: '爆发', t: 0.8, color: tr.c });
    if (m.hp <= 0) killMonster(m);
  } else if (tr.proc.type === 'poisonNova') {
    areaDamage(m.x, m.y, 85, p.dmg * 0.6, tr.c, true, val * power);
    S.impacts.push({ x: m.x, y: m.y, t: 0.4, max: 0.4, r: 85, color: tr.c, ult: true });
    S.pops.push({ x: m.x, y: m.y - 24, text: '毒爆', t: 0.8, color: tr.c });
  } else if (tr.proc.type === 'explosion') {
    areaDamage(m.x, m.y, 85, p.dmg * val * power, tr.c, false);
    S.impacts.push({ x: m.x, y: m.y, t: 0.4, max: 0.4, r: 90, color: tr.c, ult: true });
    S.pops.push({ x: m.x, y: m.y - 24, text: '爆炸', t: 0.8, color: tr.c });
  } else if (tr.proc.type === 'break') {
    m.amp = Math.max(m.amp || 0, val * power);
    m.ampT = 4 * S.mods.procDur;
    S.pops.push({ x: m.x, y: m.y - 24, text: '破甲', t: 0.8, color: tr.c });
  } else if (tr.proc.type === 'shove') {
    m.y = Math.max(SPAWN_Y, m.y - val * power * (m.boss ? 0.3 : 1));
    m.slowAmt = Math.max(m.slowAmt || 0, .3);
    m.slowT = Math.max(m.slowT || 0, 2 * S.mods.procDur);
    S.pops.push({ x: m.x, y: m.y - 24, text: '击退', t: 0.8, color: tr.c });
  }
}

function areaDamage(x, y, r, dmg, color, applyDot, dotDps) {
  for (var i = 0; i < S.monsters.length; i++) {
    var m = S.monsters[i];
    if (m.dead) continue;
    var d = Math.sqrt((m.x - x) * (m.x - x) + (m.y - y) * (m.y - y));
    if (d > r) continue;
    m.hp -= dmg * (TYPES[m.type].dr || 1) * (1 + (m.amp || 0));
    m.hurt = 0.12;
    if (applyDot) {
      m.dot = { dps: Math.max(m.dot ? m.dot.dps : 0, dotDps), t: Math.max(m.dot ? m.dot.t : 0, 4) };
    }
    if (m.hp <= 0) killMonster(m);
  }
  if (color) S.impacts.push({ x: x, y: y, t: 0.3, max: 0.3, r: r, color: color });
}

function triggerDomain() {
  if (!S.domain) return;
  var d = domainOf(S.domain);
  var p = profile();
  var power = S.mods.domainPower;
  var radius = 90 * S.mods.domainRadius;
  var list = S.monsters.slice();
  var target = null, bestY = -1;
  for (var i = 0; i < list.length; i++) {
    if (!list[i].dead && list[i].y > bestY) { bestY = list[i].y; target = list[i]; }
  }
  if (!target) return;

  if (S.domain === 'frost') {
    var hitCount = 0;
    for (var a = 0; a < list.length && hitCount < 3; a++) {
      var ma = list[a];
      if (ma.dead) continue;
      var da = Math.sqrt((ma.x - target.x) * (ma.x - target.x) + (ma.y - target.y) * (ma.y - target.y));
      if (da > 190) continue;
      ma.hp -= (35 + p.dmg) * power * (TYPES[ma.type].dr || 1) * (1 + (ma.amp || 0));
      ma.hurt = 0.16;
      ma.frozenT = Math.max(ma.frozenT, 0.4);
      if (ma.hp <= 0) killMonster(ma);
      S.impacts.push({ x: ma.x, y: ma.y, t: 0.3, max: 0.3, r: 24, color: d.c, ult: true });
      hitCount++;
    }
  } else if (S.domain === 'frostblast') {
    areaDamage(target.x, target.y, radius, 60 * power, d.c, false);
    for (var b = 0; b < list.length; b++) {
      var mb = list[b];
      if (mb.dead) continue;
      var db = Math.sqrt((mb.x - target.x) * (mb.x - target.x) + (mb.y - target.y) * (mb.y - target.y));
      if (db <= radius) { mb.stacks = Math.min(STACK_MAX - 1, mb.stacks + 1); mb.stackT = 0; }
    }
    S.impacts.push({ x: target.x, y: target.y, t: 0.5, max: 0.5, r: radius, color: d.c, ult: true });
  } else if (S.domain === 'magstorm') {
    for (var c = 0; c < list.length; c++) {
      var mc = list[c];
      if (mc.dead) continue;
      mc.hp -= 30 * power * (TYPES[mc.type].dr || 1) * (1 + (mc.amp || 0));
      mc.hurt = 0.14;
      mc.x += (W / 2 - mc.x) * 0.4;
      if (mc.hp <= 0) killMonster(mc);
    }
    S.impacts.push({ x: W / 2, y: WALL_TOP - 180, t: 0.55, max: 0.55, r: 200, color: d.c, ult: true });
  } else if (S.domain === 'acidsteel') {
    for (var e = 0; e < list.length; e++) {
      var me = list[e];
      if (me.dead) continue;
      me.dot = { dps: Math.max(me.dot ? me.dot.dps : 0, 6 * power), t: 4 };
      me.amp = Math.max(me.amp || 0, .2);
      me.ampT = 4;
    }
    S.impacts.push({ x: W / 2, y: WALL_TOP - 180, t: 0.55, max: 0.55, r: 220, color: d.c, ult: true });
  } else if (S.domain === 'smoke') {
    for (var f = 0; f < list.length; f++) {
      var mf = list[f];
      if (mf.dead) continue;
      mf.slowAmt = Math.max(mf.slowAmt || 0, .4);
      mf.slowT = Math.max(mf.slowT || 0, 3);
      mf.dot = { dps: Math.max(mf.dot ? mf.dot.dps : 0, 4 * power), t: 3 };
    }
    S.impacts.push({ x: W / 2, y: WALL_TOP - 160, t: 0.55, max: 0.55, r: 240, color: d.c, ult: true });
  } else {
    areaDamage(target.x, target.y, radius, 40 * power, d.c, false);
    for (var g = 0; g < list.length; g++) {
      var mg = list[g];
      if (!mg.dead) { mg.slowAmt = Math.max(mg.slowAmt || 0, .25); mg.slowT = Math.max(mg.slowT || 0, 2); }
    }
  }
  S.pops.push({ x: target.x, y: target.y - 36, text: d.name, t: 1.0, color: d.c });
}

function killMonster(m) {
  if (m.dead) return;
  m.dead = true;
  S.stats.kills++;
  S.impacts.push({ x: m.x, y: m.y, t: 0.2, max: 0.2, r: TYPES[m.type].r + 10, color: ELEMS[S.form].c });
}

function segDist(px, py, x, y, cx, cy) {
  var dx = x - px, dy = y - py;
  var l2 = dx * dx + dy * dy;
  var t = l2 ? ((cx - px) * dx + (cy - py) * dy) / l2 : 0;
  if (t < 0) t = 0; else if (t > 1) t = 1;
  var qx = px + dx * t, qy = py + dy * t;
  return Math.sqrt((cx - qx) * (cx - qx) + (cy - qy) * (cy - qy));
}

// ---------------------------------------------------------------- 奖励
function upgradePool() {
  var phase = S.wave < 5 ? 'base' : (S.wave < 10 ? 'trait' : 'domain');
  var pool = [
    { id: 'dmg',   name: '锐化', desc: '伤害 +15%',        apply: function () { S.mods.dmgMul *= 1.15; } },
    { id: 'rate',  name: '疾咏', desc: '攻速 +12%',        apply: function () { S.mods.rateMul *= 0.88; } },
    { id: 'range', name: '远望', desc: '射程 +10%',        apply: function () { S.mods.rangeMul *= 1.1; } }
  ];
  if (S.mods.chargeMax > 10) pool.push({ id: 'charge', name: '蓄势', desc: '大招充能 -2 次', apply: function () { S.mods.chargeMax = Math.max(10, S.mods.chargeMax - 2); } });
  if (S.wall < S.wallMax) pool.push({ id: 'wall', name: '修补', desc: '城墙 +15', apply: function () { S.wall = Math.min(S.wallMax, S.wall + 15); } });
  if (phase === 'trait') {
    var tr = TRAITS[S.form];
    if (tr) {
      if (S.mods.stacksPerHit < 2) pool.push({ id: 'stack', name: '刻印', desc: '每次命中额外 +1 层（最多 2）', apply: function () { S.mods.stacksPerHit = Math.min(2, S.mods.stacksPerHit + 1); } });
      pool.push({ id: 'proc', name: '淬炼', desc: tr.name + ' 效果 +30%', apply: function () { S.mods.procPower *= 1.3; } });
      pool.push({ id: 'procDur', name: '延展', desc: tr.name + ' 持续时间 +30%', apply: function () { S.mods.procDur *= 1.3; } });
      if (tr.perHit) pool.push({ id: 'perhit', name: '渗透', desc: '每击效果 +50%', apply: function () { S.mods.perHitMul *= 1.5; } });
      if (S.mods.decayDelay < 6) pool.push({ id: 'decay', name: '滞留', desc: '印记保留 +1 秒', apply: function () { S.mods.decayDelay += 1; } });
    }
  } else if (phase === 'domain') {
    pool.push({ id: 'domainCd', name: '共鸣', desc: '领域间隔 -1 秒（最低 3）', apply: function () { S.mods.domainCd = Math.max(3, S.mods.domainCd - 1); } });
    pool.push({ id: 'domainPower', name: '领域强化', desc: '领域效果 +30%', apply: function () { S.mods.domainPower *= 1.3; } });
    pool.push({ id: 'domainRadius', name: '扩张', desc: '领域范围 +20%', apply: function () { S.mods.domainRadius *= 1.2; } });
  }
  for (var i = pool.length - 1; i > 0; i--) {
    var j = Math.floor(S.rng() * (i + 1));
    var t = pool[i]; pool[i] = pool[j]; pool[j] = t;
  }
  return pool.slice(0, 3);
}

function showUpgrade() {
  S.scene = 'choice';
  S.choiceType = 'upgrade';
  S.choices = upgradePool();
  var html = '<div class="card"><h2>第 ' + S.wave + ' 波结束 · 选一个</h2>' +
    '<p class="dim">城墙 ' + Math.round(S.wall) + ' / ' + S.wallMax + '　' +
    ELEMS[S.form].name + '（' + tierName(ELEMS[S.form].tier) + '）' +
    (TRAITS[S.form] ? ' · ' + TRAITS[S.form].name : ' · 普通攻击') +
    (S.domain ? '　领域：' + domainOf(S.domain).name : '') + '</p><div class="cards">';
  for (var i = 0; i < S.choices.length; i++) {
    html += '<div class="ucard" data-i="' + i + '"><b>' + S.choices[i].name + '</b><span>' + S.choices[i].desc + '</span></div>';
  }
  html += '</div></div>';

}

function chooseUpgrade(i) {
  var c = S.choices[i];
  if (!c) return;
  c.apply();
  S.stats.upgrades.push(c.name);
  S.choices = [];
  closeOverlay();
  startWave(S.wave + 1);
}

// 第 5 波：熔入第二元素
function showElement() {
  S.scene = 'choice';
  S.choiceType = 'element';
  var opts = [];
  for (var i = 0; i < BASE.length; i++) {
    var b = BASE[i];
    if (b === 'water') continue;
    var key = b < 'water' ? b + '+water' : 'water+' + b;
    var r = RECIPES[key];
    if (!r) continue;
    opts.push({ base: b, result: r });
  }
  S.choices = opts;
  var html = '<div class="card"><h2>第 5 波结束 · 熔入第二元素</h2>' +
    '<p class="dim">当前：水（普通攻击，无特性）。进化后普攻沿用<b>新元素的手感</b>，并获得特性。</p><div class="cards">';
  for (var j = 0; j < opts.length; j++) {
    var o = opts[j], e = ELEMS[o.result], pr = BASE_PROFILES[o.base], tr = TRAITS[o.result];
    html += '<div class="ecard" data-i="' + j + '" style="color:' + e.c + '">' +
      '<div class="orb" style="background:' + hexA(e.c, .16) + ';color:' + e.c + '">' + e.ch + '</div>' +

  }

  overlay.innerHTML = html;
  var cards = overlay.querySelectorAll('.ecard');
  for (var k = 0; k < cards.length; k++) {

      chooseElement(parseInt(e.currentTarget.getAttribute('data-i'), 10));

}

function chooseElement(i) {
  var c = S.choices[i];
  if (!c) return;
  S.form = c.result;
  S.formProfile = c.base;
  // 不继承旧特性：特性类加成全部重置，通用属性保留
  S.mods.stacksPerHit = 1;
  S.mods.procPower = 1;
  S.mods.procDur = 1;
  S.mods.decayDelay = 3;
  S.mods.perHitMul = 1;
  S.stats.upgrades.push('熔入·' + ELEMS[c.base].name);
  S.choices = [];
  closeOverlay();
  startWave(S.wave + 1);
}

// 第 10 波：融合领域（第三元素，普攻形态不变）
function domainOptions() {
  var out = [];
  var ids = Object.keys(ELEMS);
  for (var i = 0; i < ids.length; i++) {
    var b = ids[i];
    if (b === S.form) continue;
    var key = S.form < b ? S.form + '+' + b : b + '+' + S.form;
    var r = RECIPES[key];
    if (!r || REDUCE[key] || r === S.form) continue;
    if (out.some(function (o) { return o.result === r; })) continue;
    out.push({ result: r, base: b });
  }
  out.sort(function (a, b) {
    var da = DOMAINS[a.result] ? 1 : 0, db = DOMAINS[b.result] ? 1 : 0;
    if (db !== da) return db - da;
    return ELEMS[b.result].tier - ELEMS[a.result].tier;
  });
  if (out.length < 3) out.push({ skip: true });
  return out.slice(0, 3);
}

function showDomain() {
  S.scene = 'choice';
  S.choiceType = 'domain';
  S.choices = domainOptions();
  var html = '<div class="card"><h2>第 10 波结束 · 融合领域</h2>' +
    '<p class="dim">第三元素不改变普攻形态，只解锁一个自动领域。当前普攻：' +
    ELEMS[S.form].name + '（' + (TRAITS[S.form] ? TRAITS[S.form].name : '普通攻击') + '）</p><div class="cards">';
  for (var i = 0; i < S.choices.length; i++) {
    var c = S.choices[i];
    if (c.skip) {
      html += '<div class="ucard" data-i="' + i + '"><b>不融合</b><span>保留当前形态，城墙 +15</span></div>';
    } else {
      var d = domainOf(c.result), e = ELEMS[c.result];
      html += '<div class="ecard" data-i="' + i + '" style="color:' + d.c + '">' +
        '<div class="orb" style="background:' + hexA(d.c, .16) + ';color:' + d.c + '">' + e.ch + '</div>' +
        '<b>' + d.name + '</b>' +
        '<span>' + ELEMS[c.base].name + ' + ' + ELEMS[S.form].name + ' → ' + e.name + '<br>' +
        d.desc + '<br>普攻形态不变</span></div>';
    }
  }
  html += '</div></div>';
  overlay.className = 'show';
  overlay.innerHTML = html;
  var cards = overlay.querySelectorAll('.ecard,.ucard');
  for (var k = 0; k < cards.length; k++) {
    cards[k].onclick = function (e) {
      chooseDomain(parseInt(e.currentTarget.getAttribute('data-i'), 10));
    };
  }
}

function chooseDomain(i) {
  var c = S.choices[i];
  if (!c) return;
  if (c.skip) S.wall = Math.min(S.wallMax, S.wall + 15);
  else { S.domain = c.result; S.domainTimer = 2; }
  S.stats.upgrades.push(c.skip ? '不融合' : domainOf(c.result).name);
  S.choices = [];
  closeOverlay();
  startWave(S.wave + 1);
}

function lose() { showLose(); }
function win() { showWin(); }

function waveClear() {
  if (S.wave >= S.maxWave) { win(); return; }
  if (S.wave === 5) { showElement(); return; }
  if (S.wave === 10) { showDomain(); return; }
  showUpgrade();
}

function hexA(hex, a) {
  var r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
  return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';
}

// ---------------------------------------------------------------- 绘制
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function draw() {
  if (!S) return;
  var i;

  var bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#0c1420');
  bg.addColorStop(1, '#080d14');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  if (S.scene === 'title') return;

  // 地表线
  ctx.strokeStyle = 'rgba(120,160,200,0.05)';
  ctx.lineWidth = 1;
  for (i = 0; i < 8; i++) {
    ctx.beginPath();
    ctx.moveTo(0, 100 + i * 52 + 24);
    ctx.lineTo(W, 100 + i * 52 + 24);
    ctx.stroke();
  }

  // 射程
  var p = profile();
  ctx.beginPath();
  ctx.arc(TURRET.x, TURRET.y, p.range, Math.PI, Math.PI * 2);
  ctx.strokeStyle = 'rgba(226,193,74,0.07)';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // 领域氛围
  if (S.domain) {
    var dc = domainOf(S.domain).c;
    ctx.beginPath();
    ctx.arc(TURRET.x, TURRET.y - 4, 70, Math.PI, Math.PI * 2);
    ctx.strokeStyle = hexA(dc, 0.18);
    ctx.lineWidth = 6;
    ctx.stroke();
  }

  // 怪物
  for (i = 0; i < S.monsters.length; i++) {
    var m = S.monsters[i];
    if (m.dead) continue;
    var T = TYPES[m.type];
    var r = T.r;
    ctx.beginPath();
    ctx.arc(m.x, m.y, r, 0, Math.PI * 2);
    ctx.fillStyle = m.frozenT > 0 ? '#9fe8ff' : (m.dot ? '#7ed957' : T.color);
    ctx.globalAlpha = m.hurt > 0 ? 0.7 : 1;
    ctx.fill();
    ctx.globalAlpha = 1;
    if (m.slowT > 0) {
      ctx.strokeStyle = 'rgba(140,220,255,.8)';
      ctx.lineWidth = 3;
      ctx.stroke();
    }
    if (m.frozenT > 0) {
      ctx.strokeStyle = '#e8ffff';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(m.x, m.y, r + 4, 0, Math.PI * 2);
      ctx.stroke();
    }
    if (S.mark === m.id) {
      ctx.strokeStyle = '#ffe14a';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(m.x, m.y, r + 6, 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.fillStyle = '#0a0f16';
    ctx.font = 'bold ' + (m.boss ? 15 : 11) + 'px -apple-system,sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(T.name.length > 2 ? T.name[0] : T.name, m.x, m.y + 1);

    // 血条
    var bw = m.boss ? 90 : 30;
    ctx.fillStyle = 'rgba(0,0,0,.45)';
    ctx.fillRect(m.x - bw / 2, m.y - r - 9, bw, 4);
    ctx.fillStyle = m.boss ? '#e0603c' : '#5ad2b0';
    ctx.fillRect(m.x - bw / 2, m.y - r - 9, bw * Math.max(0, m.hp / m.max), 4);

    // 5 层印记
    var tr = TRAITS[S.form];
    if (tr) {
      for (var s = 0; s < STACK_MAX; s++) {
        ctx.beginPath();
        ctx.arc(m.x - 16 + s * 8, m.y - r - 18, 2.8, 0, Math.PI * 2);
        ctx.fillStyle = s < m.stacks ? tr.c : 'rgba(255,255,255,.30)';
        ctx.globalAlpha = m.procCd > 0 ? 0.35 : 1;
        ctx.fill();
        ctx.globalAlpha = 1;
      }
    }
  }

  // 子弹
  for (i = 0; i < S.shots.length; i++) {
    var sh = S.shots[i];
    ctx.strokeStyle = sh.color;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(sh.px, sh.py);
    ctx.lineTo(sh.x, sh.y);
    ctx.stroke();
  }

  // 冲击
  for (i = 0; i < S.impacts.length; i++) {
    var im = S.impacts[i];
    var k = 1 - im.t / im.max;
    ctx.beginPath();
    ctx.arc(im.x, im.y, Math.max(4, im.r * k), 0, Math.PI * 2);
    ctx.strokeStyle = hexA(im.color || '#e0603c', 0.6 * (1 - k));
    ctx.lineWidth = im.ult ? 5 : 3;
    ctx.stroke();
  }

  // 飘字
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (i = 0; i < S.pops.length; i++) {
    var po = S.pops[i];
    ctx.fillStyle = po.color;
    ctx.font = 'bold ' + (po.text.length > 3 ? 18 : 14) + 'px -apple-system,sans-serif';
    ctx.globalAlpha = Math.min(1, po.t * 2);
    ctx.fillText(po.text, po.x, po.y);
    ctx.globalAlpha = 1;
  }

  // 炮台
  ctx.beginPath();
  ctx.arc(TURRET.x, TURRET.y, 20, 0, Math.PI * 2);
  ctx.fillStyle = '#1a2637';
  ctx.fill();
  ctx.strokeStyle = ELEMS[S.form].c;
  ctx.lineWidth = 3;
  ctx.stroke();
  ctx.fillStyle = ELEMS[S.form].c;
  ctx.font = 'bold 12px -apple-system,sans-serif';
  ctx.fillText(ELEMS[S.form].ch, TURRET.x, TURRET.y + 1);

  // 城墙
  var wallW = W - 80;
  ctx.fillStyle = '#131c29';
  ctx.fillRect(40, WALL_TOP, wallW, 42);
  var ratio = Math.max(0, S.wall / S.wallMax);
  var wg = ctx.createLinearGradient(40, 0, 40 + wallW, 0);
  wg.addColorStop(0, ratio > .35 ? '#2f7d5d' : '#a5462f');
  wg.addColorStop(1, ratio > .35 ? '#5ad2b0' : '#e0603c');
  ctx.fillStyle = wg;
  ctx.fillRect(40, WALL_TOP, wallW * ratio, 42);
  ctx.strokeStyle = '#223047';
  ctx.lineWidth = 1;
  ctx.strokeRect(40, WALL_TOP, wallW, 42);
  ctx.fillStyle = '#e8eef7';
  ctx.font = 'bold 15px ui-monospace,Menlo,monospace';
  ctx.textAlign = 'center';
  ctx.fillText('城墙 ' + Math.ceil(S.wall) + ' / ' + S.wallMax, W / 2, WALL_TOP + 22);

  // HUD
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#e8eef7';
  ctx.font = 'bold 17px -apple-system,sans-serif';
  ctx.fillText('第 ' + S.wave + ' / ' + S.maxWave + ' 波', 26, 32);
  ctx.fillStyle = '#7d8ca3';
  ctx.font = '12px ui-monospace,Menlo,monospace';
  ctx.fillText('击杀 ' + S.stats.kills + ' · 漏怪 ' + S.stats.leaks, 26, 56);

  ctx.textAlign = 'center';
  ctx.fillStyle = ELEMS[S.form].c;
  ctx.font = 'bold 18px -apple-system,sans-serif';
  ctx.fillText(ELEMS[S.form].name + ' · ' + tierName(ELEMS[S.form].tier), W / 2, 30);
  ctx.fillStyle = '#5c6f85';
  ctx.font = '11px ui-monospace,Menlo,monospace';
  ctx.fillText((TRAITS[S.form] ? '特性：' + TRAITS[S.form].name : '普通攻击') +
    ' · 单发 ' + p.dmg.toFixed(1) + ' · 攻速 ' + (1 / p.rate).toFixed(1) + '/s', W / 2, 52);

  // 充能 + 领域
  var cw = 190, cx = W - 26 - cw, cy = 24;
  ctx.fillStyle = 'rgba(255,255,255,.07)';
  roundRect(cx, cy, cw, 9, 4.5); ctx.fill();
  ctx.fillStyle = ELEMS[S.form].c;
  roundRect(cx, cy, cw * Math.min(1, S.charge / S.mods.chargeMax), 9, 4.5); ctx.fill();
  ctx.fillStyle = '#7d8ca3';
  ctx.font = '10.5px ui-monospace,Menlo,monospace';
  ctx.textAlign = 'right';
  ctx.fillText('元素爆发 ' + S.charge + ' / ' + S.mods.chargeMax, W - 26, 48);

  ctx.textAlign = 'right';
  if (S.domain) {
    var dom = domainOf(S.domain);
    ctx.fillStyle = dom.c;
    ctx.font = '12px -apple-system,sans-serif';
    ctx.fillText(dom.name + ' · ' + Math.max(0, S.domainTimer).toFixed(1) + 's', W - 26, 70);
  } else {
    ctx.fillStyle = '#5c6f85';
    ctx.font = '11px ui-monospace,Menlo,monospace';
    ctx.fillText('领域：第 10 波', W - 26, 70);
  }

  // 提示
  ctx.textAlign = 'left';
  ctx.fillStyle = 'rgba(255,255,255,.22)';
  ctx.font = '12px -apple-system,sans-serif';
  ctx.fillText('空格 暂停 · 点击怪物 标记优先目标', 26, 612);

  if (S.paused) {
    ctx.fillStyle = 'rgba(7,10,16,.65)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#e8eef7';
    ctx.font = 'bold 26px -apple-system,sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('暂停', W / 2, H / 2);
  }

  if (S.toast) {
    ctx.fillStyle = 'rgba(19,28,41,.92)';
    ctx.strokeStyle = '#223047';
    ctx.lineWidth = 1;
    roundRect(W / 2 - 190, 76, 380, 40, 10);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#e8eef7';
    ctx.font = '14px -apple-system,sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(S.toast.text, W / 2, 96);
  }
}

// ---------------------------------------------------------------- 输入
cv.addEventListener('click', function (e) {
  if (!S || S.scene !== 'play') return;
  var rect = cv.getBoundingClientRect();
  var x = (e.clientX - rect.left) * W / rect.width;
  var y = (e.clientY - rect.top) * H / rect.height;
  var best = null, bestD = 999;
  for (var i = 0; i < S.monsters.length; i++) {
    var m = S.monsters[i];
    if (m.dead) continue;
    var d = Math.sqrt((m.x - x) * (m.x - x) + (m.y - y) * (m.y - y));
    if (d < TYPES[m.type].r + 10 && d < bestD) { best = m; bestD = d; }
  }
  S.mark = best ? best.id : null;
});

window.addEventListener('keydown', function (e) {
  if (!S) return;
  if (e.key === ' ' || e.code === 'Space') {
    e.preventDefault();
    if (S.scene === 'play') S.paused = !S.paused;
  }
});

// ---------------------------------------------------------------- 启动
var _q = (typeof location !== 'undefined') ? new URLSearchParams(location.search) : null;
if (_q && _q.get('seed')) SEED = parseInt(_q.get('seed'), 10) || 1;

showTitle();

if (_q && _q.get('autostart')) {
  var _el = _q.get('element');
  if (BASE.indexOf(_el) < 0) _el = 'water';
  startRun(_el, SEED);
  var _w = parseInt(_q.get('wave'), 10);
  if (_w > 1) {
    var _f = _q.get('form');
    if (_f && ELEMS[_f]) {
      S.form = _f;
      var _p = _q.get('profile');
      if (_p && BASE_PROFILES[_p]) S.formProfile = _p;
      else if (_f === 'ice') S.formProfile = 'wind';
      else if (_f === 'thunder') S.formProfile = 'fire';
      else if (_f === 'poison') S.formProfile = 'earth';
    }
    var _d = _q.get('domain');
    if (_d && ELEMS[_d]) { S.domain = _d; S.domainTimer = 3; }
    if (_q.get('wall')) S.wall = Math.max(1, Math.min(100, parseInt(_q.get('wall'), 10) || 100));
    startWave(Math.min(MAX_WAVE, Math.max(1, _w)));
  }
}

var lastTs = 0;
function frame(ts) {
  var dt = lastTs ? Math.min((ts - lastTs) / 1000, 0.06) : 0.016;
  lastTs = ts;
  update(dt);
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

window.__CG = {
  get state() { return S; },
  startRun: startRun,
  startWave: startWave,
  update: update,
  chooseUpgrade: chooseUpgrade,
  chooseElement: chooseElement,
  chooseDomain: chooseDomain,
  profile: profile,
  showTitle: showTitle,
  ELEMS: ELEMS,
  RECIPES: RECIPES,
  TRAITS: TRAITS,
  DOMAINS: DOMAINS,
  domainOf: domainOf,
  TYPES: TYPES,
  WAVES: WAVES,
  BASE: BASE,
  tierName: tierName
};
})();
</script>
</body>
</html>
